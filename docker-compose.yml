version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: cashcompass-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: cashcompass
    volumes:
      - mongodb_data:/data/db
    networks:
      - cashcompass-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cashcompass-backend
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/cashcompass?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRE: 7d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cashcompass-network

  # Python Chatbot Backend (ML Models)
  chatbot:
    build:
      context: ./chatbot-backend
      dockerfile: Dockerfile
    container_name: cashcompass-chatbot
    restart: unless-stopped
    ports:
      - "5051:5001"
    environment:
      FLASK_ENV: production
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - ./chatbot-backend/transactions.csv:/app/transactions.csv:ro
    networks:
      - cashcompass-network

  # React Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cashcompass-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - chatbot
    networks:
      - cashcompass-network

networks:
  cashcompass-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
